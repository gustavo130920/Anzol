<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <title>Arquitetura do Anzol</title>
  <desc>Três camadas: aparelho do cidadão (onde roda o app e onde ficam o link e as provas), nuvem (GitHub Pages, GitHub Actions, CDN do OCR) e fontes externas (listas de phishing, RDAP, alertas oficiais). Linhas tracejadas são roteiro de evolução.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <marker id="seta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fcfcfb"/>

  <!-- Título -->
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0b3b66">Anzol — arquitetura</text>
  <text x="40" y="70" font-size="14" fill="#52514e">Um motor de sinais, várias vitrines. Regras primeiro, IA leve e visão computacional no aparelho, nuvem gratuita.</text>

  <!-- CAMADA 1: APARELHO -->
  <rect x="30" y="92" width="560" height="590" rx="16" fill="#eef4fc" stroke="#9ec5f4" stroke-width="1.5"/>
  <text x="50" y="122" font-size="17" font-weight="700" fill="#104281">1. Aparelho do cidadão (navegador ou PWA)</text>
  <text x="50" y="142" font-size="12.5" fill="#52514e">HTML + CSS + JavaScript puros · fonte grande, voz, modo escuro</text>

  <!-- Motor de sinais -->
  <rect x="190" y="160" width="240" height="56" rx="10" fill="#0b3b66"/>
  <text x="310" y="184" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Motor de sinais</text>
  <text x="310" y="203" font-size="12" fill="#cde2fb" text-anchor="middle">38 pistas · 4 perguntas</text>

  <!-- Módulos -->
  <g font-size="13">
    <rect x="50" y="244" width="160" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="130" y="268" font-weight="700" text-anchor="middle" fill="#0b0b0b">Scanner</text>
    <text x="130" y="286" font-size="11.5" text-anchor="middle" fill="#52514e">REGRAS: domínio e texto</text>
    <text x="130" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">risco + motivos</text>

    <rect x="230" y="244" width="160" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="310" y="268" font-weight="700" text-anchor="middle" fill="#0b0b0b">Radar</text>
    <text x="310" y="286" font-size="11.5" text-anchor="middle" fill="#52514e">IA LEVE: TF-IDF</text>
    <text x="310" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">3 estados · HMAC</text>

    <rect x="410" y="244" width="160" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="490" y="268" font-weight="700" text-anchor="middle" fill="#0b0b0b">Testes (jogo)</text>
    <text x="490" y="286" font-size="11.5" text-anchor="middle" fill="#52514e">19 itens · XP · reteste</text>
    <text x="490" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">teste do dia (regra)</text>

    <rect x="50" y="332" width="160" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="130" y="356" font-weight="700" text-anchor="middle" fill="#0b0b0b">Caí no golpe</text>
    <text x="130" y="374" font-size="11.5" text-anchor="middle" fill="#52514e">triagem por regras</text>
    <text x="130" y="390" font-size="11.5" text-anchor="middle" fill="#52514e">fontes oficiais + datas</text>

    <rect x="230" y="332" width="160" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="310" y="356" font-weight="700" text-anchor="middle" fill="#0b0b0b">Kit de provas</text>
    <text x="310" y="374" font-size="11.5" text-anchor="middle" fill="#52514e">VISÃO COMPUTACIONAL</text>
    <text x="310" y="390" font-size="11.5" text-anchor="middle" fill="#52514e">OCR + impressão digital</text>

    <rect x="410" y="332" width="160" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="490" y="356" font-weight="700" text-anchor="middle" fill="#0b0b0b">Escudo + Painel</text>
    <text x="490" y="374" font-size="11.5" text-anchor="middle" fill="#52514e">8 cartões · checklist</text>
    <text x="490" y="390" font-size="11.5" text-anchor="middle" fill="#52514e">ANÁLISE DE DADOS</text>
  </g>
  <!-- ligações motor → módulos -->
  <g stroke="#2a78d6" stroke-width="1.6" fill="none">
    <path d="M250 216 L130 244"/><path d="M310 216 L310 244"/><path d="M370 216 L490 244"/>
  </g>

  <!-- Dados no aparelho -->
  <rect x="50" y="424" width="520" height="96" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-dasharray="0"/>
  <text x="66" y="448" font-size="13.5" font-weight="700" fill="#0b0b0b">Dados no aparelho</text>
  <text x="66" y="468" font-size="12" fill="#52514e">• Conteúdo em JSON: pistas, 19 cenários, regras do Radar, socorro, Escudo</text>
  <text x="66" y="486" font-size="12" fill="#52514e">• localStorage: progresso do jogo, checklist, relatos e moderação (SIMULAÇÃO)</text>
  <text x="66" y="504" font-size="12" fill="#52514e">• Imagens das provas: só na memória da página (nunca salvas nem enviadas)</text>

  <!-- Fronteira de privacidade -->
  <rect x="50" y="540" width="520" height="122" rx="10" fill="#e6f4ec" stroke="#11683a" stroke-width="1.5"/>
  <text x="66" y="565" font-size="14" font-weight="700" fill="#11683a">Fronteira de privacidade</text>
  <text x="66" y="586" font-size="12" fill="#14181f">• O link colado e as provas NÃO saem do aparelho.</text>
  <text x="66" y="604" font-size="12" fill="#14181f">• Listas de phishing são BAIXADAS e comparadas aqui.</text>
  <text x="66" y="622" font-size="12" fill="#14181f">• Relato: só indicadores do golpista, com consentimento;</text>
  <text x="66" y="640" font-size="12" fill="#14181f">  telefone e chave Pix como HMAC (código com segredo).</text>

  <!-- CAMADA 2: NUVEM -->
  <rect x="620" y="92" width="300" height="590" rx="16" fill="#f4f2fb" stroke="#b7aef0" stroke-width="1.5"/>
  <text x="640" y="122" font-size="17" font-weight="700" fill="#3f2fa0">2. Nuvem (plano gratuito)</text>

  <rect x="640" y="140" width="260" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="656" y="164" font-size="14" font-weight="700" fill="#0b0b0b">GitHub Pages</text>
  <text x="656" y="184" font-size="12" fill="#52514e">hospedagem estática com HTTPS</text>
  <text x="656" y="202" font-size="12" fill="#52514e">entrega o app e os dados</text>

  <rect x="640" y="236" width="260" height="114" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="656" y="260" font-size="14" font-weight="700" fill="#0b0b0b">GitHub Actions</text>
  <text x="656" y="280" font-size="12" fill="#52514e">a cada mudança: roda os testes</text>
  <text x="656" y="298" font-size="12" fill="#52514e">e só publica se passarem (CI/CD)</text>
  <text x="656" y="316" font-size="12" fill="#52514e">todo dia: atualiza o recorte .br</text>
  <text x="656" y="334" font-size="12" fill="#52514e">das listas de phishing e republica</text>

  <rect x="640" y="368" width="260" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="656" y="392" font-size="14" font-weight="700" fill="#0b0b0b">CDN jsDelivr</text>
  <text x="656" y="412" font-size="12" fill="#52514e">entrega o OCR (Tesseract.js) só</text>
  <text x="656" y="430" font-size="12" fill="#52514e">quando a pessoa pede a leitura</text>

  <rect x="640" y="470" width="260" height="96" rx="10" fill="#ffffff" stroke="#6250d6" stroke-dasharray="6 5"/>
  <text x="656" y="494" font-size="14" font-weight="700" fill="#3f2fa0">Banco em nuvem (evolução)</text>
  <text x="656" y="514" font-size="12" fill="#52514e">Postgres gerenciado (ex.: Supabase)</text>
  <text x="656" y="532" font-size="12" fill="#52514e">Radar compartilhado + fila de</text>
  <text x="656" y="550" font-size="12" fill="#52514e">moderação com equipe humana</text>

  <rect x="640" y="584" width="260" height="78" rx="10" fill="#ffffff" stroke="#6250d6" stroke-dasharray="6 5"/>
  <text x="656" y="608" font-size="14" font-weight="700" fill="#3f2fa0">API do Radar (evolução)</text>
  <text x="656" y="628" font-size="12" fill="#52514e">painel para bancos, operadoras</text>
  <text x="656" y="646" font-size="12" fill="#52514e">e prefeituras (sustentabilidade)</text>

  <!-- CAMADA 3: FONTES -->
  <rect x="950" y="92" width="220" height="590" rx="16" fill="#fff6e6" stroke="#f2c766" stroke-width="1.5"/>
  <text x="966" y="122" font-size="17" font-weight="700" fill="#8a5a00">3. Fontes externas</text>

  <rect x="966" y="140" width="188" height="82" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="978" y="163" font-size="13.5" font-weight="700" fill="#0b0b0b">OpenPhish</text>
  <text x="978" y="182" font-size="11.5" fill="#52514e">lista de phishing ao vivo</text>
  <text x="978" y="198" font-size="11.5" fill="#52514e">baixada pelo navegador;</text>
  <text x="978" y="214" font-size="11.5" fill="#52514e">sem cópia guardada</text>

  <rect x="966" y="236" width="188" height="82" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="978" y="259" font-size="13.5" font-weight="700" fill="#0b0b0b">Phishing.Database</text>
  <text x="978" y="278" font-size="11.5" fill="#52514e">licença MIT; recorte de</text>
  <text x="978" y="294" font-size="11.5" fill="#52514e">3.333 domínios .br como</text>
  <text x="978" y="310" font-size="11.5" fill="#52514e">impressão digital (hash)</text>

  <rect x="966" y="332" width="188" height="82" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="978" y="355" font-size="13.5" font-weight="700" fill="#0b0b0b">Alertas oficiais</text>
  <text x="978" y="374" font-size="11.5" fill="#52514e">Detrans, OAB-SP, Banco</text>
  <text x="978" y="390" font-size="11.5" fill="#52514e">Central, Anatel: semeiam</text>
  <text x="978" y="406" font-size="11.5" fill="#52514e">o Radar e o conteúdo</text>

  <rect x="966" y="428" width="188" height="82" rx="10" fill="#ffffff" stroke="#6250d6" stroke-dasharray="6 5"/>
  <text x="978" y="451" font-size="13.5" font-weight="700" fill="#3f2fa0">RDAP Registro.br</text>
  <text x="978" y="470" font-size="11.5" fill="#52514e">idade de domínios .br;</text>
  <text x="978" y="486" font-size="11.5" fill="#52514e">CORS testado; no MVP a</text>
  <text x="978" y="502" font-size="11.5" fill="#52514e">idade é SIMULADA</text>

  <rect x="966" y="524" width="188" height="66" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="978" y="547" font-size="13.5" font-weight="700" fill="#0b0b0b">Pesquisas</text>
  <text x="978" y="566" font-size="11.5" fill="#52514e">GASA 2026 · FBSP · Febraban</text>
  <text x="978" y="582" font-size="11.5" fill="#52514e">(funil de referência)</text>

  <!-- Setas -->
  <g stroke="#52514e" stroke-width="1.6" fill="none">
    <path d="M640 180 L575 180" marker-end="url(#seta)"/>
    <path d="M640 407 L395 368" marker-end="url(#seta)"/>
    <path d="M700 236 L700 220" marker-end="url(#seta)"/>
    <path d="M966 277 L902 300" marker-end="url(#seta)"/>
  </g>
  <g stroke="#2a78d6" stroke-width="1.6" fill="none">
    <path d="M966 200 L935 227 L596 227" marker-end="url(#seta-azul)"/>
  </g>
  <g stroke="#6250d6" stroke-width="1.6" fill="none" stroke-dasharray="6 5">
    <path d="M640 518 L392 300" marker-end="url(#seta)"/>
  </g>
  <text x="600" y="172" font-size="11" fill="#52514e" text-anchor="end">app + dados</text>
  <text x="935" y="296" font-size="11" fill="#52514e">diário</text>
  <text x="770" y="231" font-size="10.5" fill="#2a78d6" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#f4f2fb" stroke-width="4">lista baixada e comparada no aparelho</text>

  <!-- Legenda -->
  <g font-size="12" fill="#52514e">
    <line x1="40" y1="716" x2="80" y2="716" stroke="#52514e" stroke-width="1.6"/>
    <text x="88" y="720">funciona hoje (real)</text>
    <line x1="250" y1="716" x2="290" y2="716" stroke="#6250d6" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="298" y="720">roteiro de evolução</text>
    <rect x="470" y="706" width="16" height="16" rx="3" fill="#e6f4ec" stroke="#11683a"/>
    <text x="494" y="720">dados pessoais ficam no aparelho</text>
    <text x="40" y="744">REGRAS = explicáveis · IA LEVE = similaridade de texto (TF-IDF) · VISÃO COMPUTACIONAL = OCR (rede neural) + dHash · SIMULAÇÃO = dados de demonstração rotulados</text>
  </g>
</svg>
