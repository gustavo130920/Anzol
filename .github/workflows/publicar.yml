# Testar e publicar o Anzol no GitHub Pages (nuvem gratuita para repositórios públicos).
# Quando roda:
#  - a cada envio para a branch main;
#  - todo dia às 09:17 UTC (06:17 em Brasília), para atualizar o recorte .br das listas de phishing;
#  - manualmente, pela aba Actions ("Run workflow").
# Regra: se algum teste falhar, o site NÃO é publicado (a versão anterior continua no ar).
name: Testar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar-e-montar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Atualizar o recorte .br das listas de phishing (Phishing.Database, MIT)
        run: node tools/atualizar-listas.js
        continue-on-error: true   # se a fonte estiver fora do ar, segue com o recorte já versionado

      - name: Rodar todos os testes
        run: node tests/rodar-todos.js

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Empacotar o site (pasta app)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app

  publicar:
    needs: testar-e-montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
